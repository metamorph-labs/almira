api_version: almira/v1
environments:
  - key: development
    display_name: Development
    browser_origins:
      - http://localhost:3000
    collections:
      - key: assets
        display_name: Assets
        malware_scan_required: true
        storage_class: normal
        extraction:
          content: true
          ocr: true
          transcription: false
          vector_indexing: true
  - key: production
    display_name: Production
    collections:
      - key: assets
        display_name: Assets
        malware_scan_required: true
        storage_class: normal
        extraction:
          content: true
          ocr: true
          transcription: false
          vector_indexing: true
