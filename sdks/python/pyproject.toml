[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metamorph-almira"
version = "0.1.0.dev44"
description = "Official Python application SDK for Almira file storage"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Metamorph Labs" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.setuptools.package-data]
almira = ["py.typed"]
