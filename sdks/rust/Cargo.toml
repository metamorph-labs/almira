[package]
name = "metamorph-almira"
version = "0.1.0-dev.31"
edition = "2024"
rust-version = "1.85"
description = "Official Rust application SDK for Almira file storage"
license = "Apache-2.0"
repository = "https://github.com/metamorph-labs/almira"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
